<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Hors-ligne — Tikmos</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100dvh; display: grid; place-items: center;
            background: #f6f6f7; color: #0b0b0c; text-align: center; padding: 24px;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        .mark { display: flex; gap: 8px; justify-content: center; margin-bottom: 28px; }
        .tile { width: 40px; height: 40px; background: #0b0b0c; border-radius: 3px; }
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 10px; }
        p { color: #71717a; max-width: 380px; margin: 0 auto 24px; line-height: 1.6; }
        a { display: inline-block; background: #1f4dff; color: #fff; text-decoration: none;
            font-weight: 600; padding: 14px 26px; border-radius: 14px; }
    </style>
</head>
<body>
    <main>
        <div class="mark"><span class="tile"></span><span class="tile"></span></div>
        <h1>Vous êtes hors-ligne</h1>
        <p>Le suivi de vos colis nécessite une connexion. Reconnectez-vous pour reprendre là où vous en étiez.</p>
        <a href="/" onclick="location.reload()">Réessayer</a>
    </main>
</body>
</html>
